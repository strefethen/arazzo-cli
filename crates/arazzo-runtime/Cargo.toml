[package]
name = "arazzo-runtime"
description = "Arazzo workflow execution engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arazzo-expr = { path = "../arazzo-expr" }
arazzo-spec = { path = "../arazzo-spec" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Kafka receive client: pure Rust, rustls/ring TLS, SASL PLAIN/SCRAM. Exact pin
# for the same reason as async-nats below; every codec a producer may have used
# is decodable (lz4/zstd compile C through cc, as ring already does).
rskafka = { version = "=0.6.0", default-features = false, features = [
    "transport-tls",
    "compression-gzip",
    "compression-lz4",
    "compression-snappy",
    "compression-zstd",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.14", features = ["std"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
uppsala = "0.3"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tokio-util = "0.7"
percent-encoding = "2"
url = "2"
schemars = { version = "1", optional = true }

[features]
schema = ["schemars"]

[dev-dependencies]
async-nats = { version = "=0.50.0", default-features = false }
criterion = { workspace = true }
futures-util = "0.3"
proptest = "1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "criteria"
harness = false
