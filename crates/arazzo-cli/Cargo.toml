[package]
name = "arazzo-cli"
description = "CLI for executing Arazzo 1.0 API workflow specifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
arazzo-generate = { path = "../arazzo-generate" }
arazzo-spec = { path = "../arazzo-spec" }
arazzo-runtime = { path = "../arazzo-runtime", features = ["schema"] }
arazzo-mcp = { path = "../arazzo-mcp" }
arazzo-validate = { path = "../arazzo-validate" }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
indexmap = "2"
openapiv3 = "2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
regex = "1.12.3"

[dev-dependencies]
futures-util = "0.3"
multer = "3.1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tiny_http = "0.12"
