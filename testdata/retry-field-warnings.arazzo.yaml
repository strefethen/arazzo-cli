arazzo: 1.0.1
info:
  title: Retry Field Warnings
  version: 1.0.0
sourceDescriptions:
  - name: api
    url: https://example.com/openapi.yaml
    type: openapi
workflows:
  - workflowId: warn-only
    summary: Structurally valid spec whose only findings are warnings.
    steps:
      - stepId: fetch
        # Deliberately a supported form: this fixture pins retry-field warnings
        # only. The unresolvable specification form lives in
        # testdata/unsupported-operation-path.arazzo.yaml.
        operationPath: '{api}./status'
        successCriteria:
          - condition: $statusCode == 200
        onSuccess:
          - name: finish
            type: end
            retryAfter: 2
            retryLimit: 3
