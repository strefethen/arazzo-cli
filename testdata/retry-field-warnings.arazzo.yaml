arazzo: 1.0.1
info:
  title: Retry Field Validity
  version: 1.0.0
sourceDescriptions:
  - name: api
    url: https://example.com/openapi.yaml
    type: openapi
workflows:
  - workflowId: warn-only
    summary: Valid failure retry fields.
    steps:
      - stepId: fetch
        operationPath: '{api}./status'
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: retry-transient-failure
            type: retry
            retryAfter: 2
            retryLimit: 3
