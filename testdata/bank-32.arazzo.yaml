arazzo: 1.0.0
info:
  title: Bank 3.2 Relative Source
  version: 1.0.0
  description: >-
    Regression fixture for GitHub issue #3's run scenario: an operationId step
    resolved from a relative OpenAPI 3.2 source document, with no --openapi
    flag. The request base derives from the document's servers[0].url.
sourceDescriptions:
  - name: bank
    url: ./bank-32.openapi.json
    type: openapi
workflows:
  - workflowId: get-all-banks
    summary: Fetch all banks via an operationId from the 3.2 source document
    steps:
      - stepId: getAllBanks
        operationId: GetAllBanks
        successCriteria:
          - condition: $statusCode == 200
