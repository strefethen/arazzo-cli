[workspace]
members = [
  "crates/arazzo-spec",
  "crates/arazzo-validate",
  "crates/arazzo-expr",
  "crates/arazzo-runtime",
  "crates/arazzo-generate",
  "crates/arazzo-cli",
  "crates/arazzo-debug-adapter",
  "crates/arazzo-mcp",
]
# Vendored dependency unit consumed through [patch.crates-io], not a member.
exclude = ["vendor/serde_json_path_core"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Standalone Arazzo workflow executor and debugger"
keywords = ["arazzo", "openapi", "workflow", "api", "cli"]
categories = ["command-line-utilities", "web-programming"]
repository = "https://github.com/strefethen/arazzo-cli"
homepage = "https://github.com/strefethen/arazzo-cli"
readme = "README.md"
publish = false

[workspace.dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[patch.crates-io]
# Published serde_json_path_core 0.2.2 plus the qualified eight-line recursive
# numeric-equality repair. Provenance, verification and the removal criterion
# live in vendor/serde_json_path_core/PATCHES.md.
serde_json_path_core = { path = "vendor/serde_json_path_core" }
