asyncapi: 3.0.0
info:
  title: Orders events
  version: 1.0.0
  description: >-
    Order lifecycle events on a local Kafka broker. `scripts/kafka/broker.sh up`
    starts the pinned single-node broker this document points at.
servers:
  local:
    host: 127.0.0.1:19092
    protocol: kafka
    description: The harness broker started by scripts/kafka/broker.sh up.
channels:
  orderPlaced:
    address: orders.placed
    description: One JSON record per placed order.
    messages:
      orderPlaced:
        contentType: application/json
        correlationId:
          description: Order id the record carries in its orderId header.
          location: "$message.header#/orderId"
        payload:
          type: object
          required: [orderId, status]
          properties:
            orderId:
              type: integer
            status:
              type: string
operations:
  receiveOrderPlaced:
    action: receive
    channel:
      $ref: '#/channels/orderPlaced'
    summary: Wait for the next placed order.
