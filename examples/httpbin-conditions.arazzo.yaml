arazzo: 1.0.0
info:
  title: HTTPBin Condition Expression Tests
  version: 1.0.0
  description: >
    Tests Arazzo comparison and compound operators (&&, ||),
    plus regex conditions for substring checks.
sourceDescriptions:
  - name: httpbin
    url: ./descriptions/httpbin.openapi.yaml
    type: openapi
workflows:
  - workflowId: status-code-comparisons
    summary: Test numeric comparison operators on status codes
    steps:
      - stepId: check-200
        operationPath: '{$sourceDescriptions.httpbin.url}#/paths/~1status~1200/get'
        successCriteria:
          - condition: $statusCode == 200
          - condition: $statusCode != 404
          - condition: $statusCode < 300
          - condition: $statusCode >= 200
          - condition: $statusCode <= 200
          - condition: $statusCode > 199
    outputs: {}

  - workflowId: body-string-equality
    summary: Verify response body string field equality
    steps:
      - stepId: fetch-data
        operationPath: '{$sourceDescriptions.httpbin.url}#/paths/~1get/get'
        parameters:
          - name: fruit
            in: query
            value: "apple"
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          fruit: $response.body#/args/fruit
      - stepId: verify-value
        operationPath: '{$sourceDescriptions.httpbin.url}#/paths/~1get/get'
        parameters:
          - name: check
            in: query
            value: $steps.fetch-data.outputs.fruit
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body.args.check == 'apple'
    outputs:
      fruit: $steps.fetch-data.outputs.fruit

  - workflowId: contains-operator
    summary: Test regex substring conditions on response body strings
    steps:
      - stepId: fetch-url
        operationPath: '{$sourceDescriptions.httpbin.url}#/paths/~1get/get'
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body#/url
            type: regex
            condition: httpbin
          - context: $response.body#/headers/Host
            type: regex
            condition: httpbin
    outputs: {}

  - workflowId: compound-conditions
    summary: Test && and || compound conditions
    steps:
      - stepId: success-range
        operationPath: '{$sourceDescriptions.httpbin.url}#/paths/~1status~1200/get'
        successCriteria:
          - condition: $statusCode >= 200 && $statusCode < 300
      - stepId: fetch-with-or
        operationPath: '{$sourceDescriptions.httpbin.url}#/paths/~1get/get'
        successCriteria:
          - condition: $statusCode == 200 || $statusCode == 201
    outputs: {}
