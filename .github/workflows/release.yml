name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: arazzo-cli
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build release binary (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            exe_suffix: ""
          - os: macos-latest
            label: macos
            exe_suffix: ""
          - os: windows-latest
            label: windows-x86_64
            exe_suffix: ".exe"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "ERROR: checked out $head_commit, expected ${RELEASE_TAG} at $tag_commit." >&2
            exit 1
          fi

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Verify publish settings
        shell: bash
        run: bash scripts/ci/verify-private-workspace.sh

      - name: Build release binary
        run: cargo build --locked --release -p arazzo-cli

      - name: Smoke test release binary
        shell: bash
        run: |
          set -euo pipefail
          BIN_PATH="target/release/${BIN_NAME}${{ matrix.exe_suffix }}"
          "$BIN_PATH" --json validate examples/httpbin-get.arazzo.yaml >/dev/null

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_PATH="target/release/${BIN_NAME}${{ matrix.exe_suffix }}"
          OUT="dist/${BIN_NAME}-${RELEASE_TAG}-${{ matrix.label }}${{ matrix.exe_suffix }}"
          cp "$BIN_PATH" "$OUT"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Ensure tag exists
        run: git rev-parse "refs/tags/${RELEASE_TAG}"

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt

      # The release body is the CHANGELOG section for this tag, never
      # GitHub's generated summary alone -- with no PRs in the range that
      # collapses to a bare "Full Changelog" link, which is what v0.6.0
      # first published. A tag with no section is a hard failure here
      # rather than a silently empty release page.
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "ERROR: CHANGELOG.md has no entry for ${RELEASE_TAG}." >&2
            echo "Expected a section headed '## [${version}] - <date>'." >&2
            echo "Add it before tagging; a release must not publish empty notes." >&2
            exit 1
          fi
          echo "Release notes for ${RELEASE_TAG}:"
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
