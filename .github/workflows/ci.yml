name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Fetch vendored spec
        shell: bash
        run: ./spec/fetch.sh && git diff --exit-code -- spec/SHA256SUMS

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Format (Linux only)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Fetch vendored spec
        shell: bash
        run: ./spec/fetch.sh && git diff --exit-code -- spec/SHA256SUMS

      - name: Verify publish settings
        run: bash scripts/ci/verify-private-workspace.sh

      - name: Verify CHANGELOG version matches Cargo.toml
        run: bash scripts/ci/verify-changelog-version.sh

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Test
        run: cargo test --workspace --locked

      # Hermeticity guard: rerun the full suite inside a network namespace with
      # only loopback up, so a test that reintroduces a live external host
      # (e.g. httpbin.org) fails here instead of silently depending on network.
      # Test binaries are already built by the step above; --offline keeps
      # cargo itself off the network inside the namespace.
      - name: Hermeticity guard (tests offline)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --map-root-user --net -- sh -c 'ip link set lo up && cargo test --workspace --offline'

      - name: Performance baseline (non-blocking)
        continue-on-error: true
        run: bash scripts/ci/perf-baseline.sh "$RUNNER_TEMP/arazzo-perf"

      - name: Upload performance baseline artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arazzo-perf
          if-no-files-found: warn

      - name: Publish performance summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/arazzo-perf/summary.md" ]; then
            cat "$RUNNER_TEMP/arazzo-perf/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No performance summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Live Kafka evidence: the ignored `kafka_*` tests against the pinned broker
  # (plain and SASL_SSL listeners) started by scripts/kafka/broker.sh. The
  # ordinary test job never touches a broker.
  kafka-integration:
    name: Kafka integration (Linux)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Fetch vendored spec
        shell: bash
        run: ./spec/fetch.sh && git diff --exit-code -- spec/SHA256SUMS

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Start pinned Kafka broker (plain + SASL_SSL)
        run: scripts/kafka/broker.sh up --secure

      - name: Live Kafka tests
        env:
          ARAZZO_KAFKA_BOOTSTRAP: 127.0.0.1:19092
          ARAZZO_KAFKA_SECURE_BOOTSTRAP: 127.0.0.1:19093
          ARAZZO_KAFKA_CA_PEM: /tmp/arazzo-kafka/ca.pem
        run: cargo test --workspace --locked -- --ignored --test-threads=1 kafka_

      - name: Stop broker
        if: always()
        run: scripts/kafka/broker.sh down

  cross-arm:
    name: Cross-compile (aarch64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build for aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --workspace --locked --target aarch64-unknown-linux-gnu

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Fetch vendored spec
        shell: bash
        run: ./spec/fetch.sh && git diff --exit-code -- spec/SHA256SUMS

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        env:
          CARGO_BIN_EXE_arazzo-cli: ${{ github.workspace }}/target/debug/arazzo-cli
        run: cargo test --workspace --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  vscode-extension:
    name: VSCode Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Fetch vendored spec
        shell: bash
        run: ./spec/fetch.sh && git diff --exit-code -- spec/SHA256SUMS

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build native debug adapter
        run: cargo build -p arazzo-debug-adapter --locked

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install extension dependencies
        run: npm install
        working-directory: vscode-arazzo-debug

      - name: Typecheck extension
        run: npm run lint
        working-directory: vscode-arazzo-debug

      - name: Build extension
        run: npm run build
        working-directory: vscode-arazzo-debug

      - name: Test extension and native DAP transcript
        run: npm test
        working-directory: vscode-arazzo-debug
